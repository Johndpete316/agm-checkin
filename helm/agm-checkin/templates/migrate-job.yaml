{{/*
Applies ordered SQL migrations from the new image, and fails the upgrade if they
do not apply — better to stop here than to roll pods against a schema that never
migrated.

It does NOT gate the rollout. The API pod template is static and the tag never
changes, so helm upgrade rolls nothing; push-images.fish restarts the deployment
afterwards. Between this job finishing and that restart, the PREVIOUS release is
serving against the NEW schema. Migrations must therefore be backwards
compatible with the release before them — add columns, backfill and add
constraints freely, but never drop or rename something the running code still
touches. Dropping is a separate, later deploy once no live pod references it.

Upgrade only. On a fresh install there are no tables yet, so the API builds them
via AutoMigrate and applies migrations itself at startup; a hook here would race
postgres coming up for the first time.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "agm-checkin.labels" . | nindent 4 }}
    app: agm-migrate
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Failed jobs are left behind on purpose so the logs can be read.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Migrate() takes a session-level advisory lock with no context deadline, so if
  # another process is holding it (a wedged API pod mid-startup, a long-running
  # transaction) this job waits forever and blocks the upgrade with it. Bound it
  # so a stuck lock surfaces as a failed job with readable logs instead of a hang.
  activeDeadlineSeconds: {{ .Values.migrate.timeoutSeconds }}
  template:
    metadata:
      labels:
        app: agm-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.api.image }}:{{ .Values.api.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/app/migrate"]
          env:
            {{- include "agm-checkin.databaseUrlEnv" . | nindent 12 }}
