{{/*
The database password, and the DSN that embeds it, in one place.

Everything that talks to postgres reads from here rather than carrying the
password as a literal env value, so it no longer shows up in `kubectl describe
pod` or `get pod -o yaml` — which anyone with pod read access can run. Helm still
stores rendered values in its own release secret, so this narrows who can see the
password, it does not make it invisible.

Annotated as a hook on purpose. The pre-upgrade jobs (db-backup at weight -10,
migrate at -5) mount this secret, and Helm applies ordinary resources only after
the pre-upgrade phase finishes — so as a plain resource it would not exist yet on
the deploy that introduces it, and those jobs would fail to start. Weight -20
puts it ahead of both. The delete policy is before-hook-creation only, never
hook-succeeded, so it is replaced on each deploy and then persists for the
Deployments that reference it.

Trade-off worth knowing: hook resources are not part of the release manifest, so
`helm uninstall` leaves this secret behind. Delete it by hand if you ever tear
the release down.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    {{- include "agm-checkin.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
  dsn: {{ include "agm-checkin.dsn" . | quote }}
