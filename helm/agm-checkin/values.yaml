# Images are imported directly to k3s nodes — no registry needed.
# imagePullPolicy: IfNotPresent means k8s uses the locally imported image.
imagePullPolicy: IfNotPresent

api:
  replicaCount: 2
  image: agm-api
  tag: latest
  allowedOrigin: "https://checkin.reduxit.net"
  trustedProxy: "cloudflare"  # "cloudflare" (production via CF Tunnel) or "direct" (local dev, no proxy)
  authPin: ""  # Do not put the real PIN here — use values.secret.yaml instead

# Pre-upgrade schema migration job (templates/migrate-job.yaml).
migrate:
  # Hard ceiling on the job, retries included. Raise it if a future migration
  # rewrites a large table; the current set is a few DDL statements.
  timeoutSeconds: 600

# Optional pre-upgrade DB dump stage. Disabled by default and meant to be
# turned on per deploy (for risky changes) via --set dbBackup.enabled=true.
dbBackup:
  enabled: false
  existingClaim: ""           # if set, chart will use this PVC and skip creating one
  storageClass: local-path
  storageSize: 10Gi
  retention: 20               # keep newest N dumps in the PVC
  timeoutSeconds: 900
  filePrefix: predeploy

# Optional Helm-driven restore. Keep disabled unless intentionally restoring.
# This is a sharp tool: it drops and recreates the DB from one backup file.
dbRestore:
  enabled: false
  backupFile: ""              # file must exist in the backup PVC
  timeoutSeconds: 1800

frontend:
  replicaCount: 2
  image: agm-frontend
  tag: latest

postgres:
  image: postgres:16-alpine
  storageClass: local-path   # k3s default; handles the PVC on whichever node postgres lands on
  storageSize: 5Gi
  user: postgres
  password: test
  db: agm_db

pgadmin:
  image: dpage/pgadmin4:latest
  storageSize: 1Gi
  email: admin@example.com  # override in values.secret.yaml
  password: ""              # use values.secret.yaml

cloudflared:
  replicaCount: 2
  tunnelToken: ""  # use values.secret.yaml

# Syncs the ip_blocklists table into a Cloudflare Access policy so blocked IPs
# are rejected at the edge. Runs /app/cf-sync from the API image on a CronJob.
cfSync:
  enabled: true
  schedule: "*/1 * * * *"
  accountId: ""   # override in values.secret.yaml
  policyId: ""    # override in values.secret.yaml
  apiToken: ""    # use values.secret.yaml
