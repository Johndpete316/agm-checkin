services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5430:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: agm_db
    volumes:
      - ./agm_db.sql:/docker-entrypoint-initdb.d/agm_db.sql

  pgadmin4:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - 80:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=johndpete5316@outlook.com
      - PGADMIN_DEFAULT_PASSWORD=test
      - CHECK_EMAIL_DELIVERABILITY=False